[pytest]
# Make `import app` work however pytest is launched.
#
# `python -m pytest` prepends the current directory to sys.path, so the test
# modules' `from app.main import create_app` resolves. The bare `pytest`
# console script does not do that, and the backend is not pip-installed (there
# is no pyproject.toml or setup.cfg that would make `app` a real package), so
# running `pytest` directly failed at collection with:
#
#   ModuleNotFoundError: No module named 'app'
#
# `pythonpath` (pytest >= 7.0) is resolved relative to the rootdir — the
# directory holding this file — so `.` means backend/ no matter where you
# invoke pytest from. Both invocations now behave identically.
pythonpath = .

# Collect only from tests/. Otherwise a bare `pytest` walks the whole backend
# tree, including data/ and models/, looking for anything test-shaped.
testpaths = tests
