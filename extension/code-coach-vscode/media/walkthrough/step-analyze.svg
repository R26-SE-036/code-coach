<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="12" fill="#1e1e2e"/>
  <!-- Magnifying glass -->
  <circle cx="170" cy="100" r="42" fill="none" stroke="#6366f1" stroke-width="4"/>
  <line x1="200" y1="130" x2="230" y2="160" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <!-- Code inside lens -->
  <text x="147" y="93" fill="#f87171" font-family="monospace" font-size="10">int x;</text>
  <text x="147" y="110" fill="#fbbf24" font-family="monospace" font-size="10">⚠ warn</text>
  <!-- Arrow -->
  <path d="M240 100 L280 100" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4ade80"/></marker></defs>
  <!-- Result card -->
  <rect x="286" y="60" width="90" height="80" rx="10" fill="#2a2a3e" stroke="#4ade80" stroke-width="1"/>
  <text x="331" y="85" text-anchor="middle" fill="#4ade80" font-family="system-ui" font-size="22" font-weight="700">3</text>
  <text x="331" y="102" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">issues</text>
  <text x="331" y="118" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">found</text>
  <text x="331" y="134" text-anchor="middle" fill="#60a5fa" font-family="system-ui" font-size="9">1.24s</text>
  <!-- Bottom text -->
  <text x="200" y="200" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">Analyze Your Code</text>
  <text x="200" y="220" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Ctrl+Shift+P → Code Coach: Analyze Current File</text>
</svg>
