<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="12" fill="#1e1e2e"/>
  <!-- Activity bar -->
  <rect x="30" y="30" width="40" height="200" rx="6" fill="#252535"/>
  <rect x="38" y="42" width="24" height="24" rx="4" fill="#3a3a52"/>
  <rect x="38" y="76" width="24" height="24" rx="4" fill="#3a3a52"/>
  <!-- Active icon highlighted -->
  <rect x="38" y="110" width="24" height="24" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="42" y="128" fill="#a78bfa" font-family="system-ui" font-size="14">🎓</text>
  <rect x="30" y="110" width="3" height="24" rx="1" fill="#6366f1"/>
  <rect x="38" y="144" width="24" height="24" rx="4" fill="#3a3a52"/>
  <!-- Sidebar panel -->
  <rect x="80" y="30" width="180" height="200" rx="8" fill="#252535" stroke="#3a3a52" stroke-width="1"/>
  <!-- Accent bar -->
  <rect x="80" y="30" width="180" height="3" rx="1" fill="url(#grad)"/>
  <defs><linearGradient id="grad" x1="80" y1="0" x2="260" y2="0"><stop stop-color="#6366f1"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <!-- Panel header -->
  <text x="96" y="54" fill="#a78bfa" font-family="system-ui" font-size="12" font-weight="700">🎓 Code Coach</text>
  <text x="96" y="70" fill="#94a3b8" font-family="system-ui" font-size="9">Signed in as John</text>
  <!-- Issue card -->
  <rect x="90" y="82" width="160" height="100" rx="6" fill="#2a2a3e"/>
  <text x="100" y="99" fill="#94a3b8" font-family="system-ui" font-size="8" font-weight="600">ISSUE 1 / 3</text>
  <text x="100" y="114" fill="#e2e8f0" font-family="system-ui" font-size="10" font-weight="700">Missing Init</text>
  <rect x="100" y="122" width="60" height="14" rx="4" fill="rgba(251,191,36,0.15)"/>
  <text x="108" y="133" fill="#fbbf24" font-family="system-ui" font-size="8" font-weight="600">WARNING</text>
  <rect x="100" y="144" width="140" height="10" rx="3" fill="#3a3a52"/>
  <rect x="100" y="160" width="120" height="10" rx="3" fill="#3a3a52"/>
  <!-- Nav buttons -->
  <rect x="90" y="190" width="74" height="22" rx="5" fill="#3a3a52"/>
  <text x="108" y="205" fill="#94a3b8" font-family="system-ui" font-size="9">← Prev</text>
  <rect x="170" y="190" width="74" height="22" rx="5" fill="#3a3a52"/>
  <text x="194" y="205" fill="#94a3b8" font-family="system-ui" font-size="9">Next →</text>
  <!-- Editor area -->
  <rect x="270" y="30" width="110" height="200" rx="8" fill="#1e1e2e" stroke="#3a3a52" stroke-width="1"/>
  <text x="282" y="56" fill="#64748b" font-family="monospace" font-size="9">1</text>
  <text x="296" y="56" fill="#c084fc" font-family="monospace" font-size="9">public class</text>
  <text x="282" y="72" fill="#64748b" font-family="monospace" font-size="9">2</text>
  <text x="296" y="72" fill="#e2e8f0" font-family="monospace" font-size="9">  int x;</text>
  <!-- Warning highlight -->
  <rect x="294" y="62" width="78" height="14" rx="2" fill="rgba(255,191,0,0.1)" stroke="rgba(255,191,0,0.4)" stroke-width="1"/>
  <text x="282" y="88" fill="#64748b" font-family="monospace" font-size="9">3</text>
  <text x="296" y="88" fill="#e2e8f0" font-family="monospace" font-size="9">  print(x)</text>
</svg>
