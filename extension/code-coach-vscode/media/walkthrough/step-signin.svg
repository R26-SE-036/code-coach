<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" rx="12" fill="#1e1e2e"/>
  <!-- Card -->
  <rect x="80" y="30" width="240" height="200" rx="16" fill="#2a2a3e" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Lock icon -->
  <rect x="172" y="60" width="56" height="44" rx="8" fill="#3a3a52"/>
  <rect x="184" y="44" width="32" height="24" rx="12" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="200" cy="80" r="5" fill="#a78bfa"/>
