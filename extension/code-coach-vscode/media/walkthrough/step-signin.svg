  <rect x="206" y="170" width="90" height="34" rx="8" fill="none" stroke="#4b5563" stroke-width="1"/>
  <text x="251" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">Register</text>
