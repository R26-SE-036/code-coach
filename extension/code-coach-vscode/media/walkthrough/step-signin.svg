  <!-- Title -->
  <text x="200" y="130" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="700">Sign In to Code Coach</text>
  <text x="200" y="152" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Create an account or sign in to start learning</text>
  <!-- Buttons -->
