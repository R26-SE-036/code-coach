  <rect x="40" y="24" width="320" height="28" rx="10" fill="#2a2a3e"/>
  <rect x="40" y="42" width="320" height="10" fill="#2a2a3e"/>
  <circle cx="58" cy="38" r="5" fill="#f87171"/>
  <circle cx="74" cy="38" r="5" fill="#fbbf24"/>
  <circle cx="90" cy="38" r="5" fill="#4ade80"/>
  <!-- Tab -->
  <rect x="120" y="28" width="100" height="22" rx="4" fill="#1e1e2e"/>
  <text x="140" y="44" fill="#a78bfa" font-family="monospace" font-size="10">Main.java</text>
  <!-- Java code lines -->
  <text x="60" y="76" fill="#c084fc" font-family="monospace" font-size="11">public</text>
  <text x="107" y="76" fill="#60a5fa" font-family="monospace" font-size="11">class</text>
  <text x="143" y="76" fill="#4ade80" font-family="monospace" font-size="11">Main</text>
  <text x="175" y="76" fill="#e2e8f0" font-family="monospace" font-size="11">{</text>
