  <text x="210" y="98" fill="#4ade80" font-family="monospace" font-size="11">main</text>
  <text x="248" y="98" fill="#e2e8f0" font-family="monospace" font-size="11">(String[] args)</text>
  <text x="84" y="120" fill="#e2e8f0" font-family="monospace" font-size="11">int x;</text>
  <text x="84" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">System.out.println(x);</text>
  <text x="72" y="164" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>
  <text x="60" y="186" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>
