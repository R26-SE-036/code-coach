# Deploy what reaches main to the AWS server.
#
#   push to main  ->  run the backend tests, build the arm64 image, push it to
#                     ECR, and roll code-coach on the EC2 host
#
# Pushes and pull requests to dev are already tested by backend-tests.yml; this
# runs the same suite again on main so nothing is deployed without passing it.
#
# AWS access is OpenID Connect: GitHub proves which repository and branch the
# run is for, and AWS hands back credentials for about an hour. No access keys
# are stored here. The role (vars.AWS_DEPLOY_ROLE_ARN) trusts only the main
# branch of the five Code Guru repositories, and on the host it may run one
# thing - the codeguru-deploy SSM document, which takes a service name and a
# commit SHA and nothing else.
#
# Code Coach is the identity provider for every other component, so a failed
# health check here rolls back before anyone else's sign-in notices.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    name: Test - backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - working-directory: backend
        run: python -m pytest -q tests

  build:
    name: Build code-coach
    needs: test
    if: github.ref == 'refs/heads/main'
    # The server is arm64 (t4g), so the image is built on an arm64 runner
    # rather than emulated.
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/codeguru/code-coach:${{ github.sha }}
          cache-from: type=gha,scope=code-coach
          cache-to: type=gha,mode=max,scope=code-coach

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-code-coach
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll the service on the server
        run: |
          service=code-coach
          id=$(aws ssm send-command --document-name codeguru-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "{\"service\":[\"$service\"],\"tag\":[\"$GITHUB_SHA\"]}" \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          if [ "$status" != Success ]; then
            echo "::error::$service was not deployed ($status); the server kept the previous image"
            exit 1
          fi
